site_name: gohatch
site_description: A project scaffolding tool for Go, inspired by gonew
site_url: https://gohatch.readthedocs.io/
repo_url: https://github.com/oliverandrich/gohatch
repo_name: oliverandrich/gohatch
copyright: "&copy; 2025 Oliver Andrich. All rights reserved."

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.top
    - search.highlight
    - search.suggest

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Usage: usage.md
  - Templates: creating-templates.md
  - Template Variables: templates.md
  - License: license.md
  - Third-Party Licenses: third-party-licenses.md
